# ============================================================================
# CI：每次 push / PR 都用一台**干净的 Linux 机器**重跑全部验证
#
# 为什么这件事对本项目特别重要（见 learn/02-CI-CD实践.md §2.1）：
#   开发环境是 **Windows 编译 + WSL 发命令**，而部署目标是 **Linux + Nginx**。
#   这个落差只会在部署当天暴露 —— 除非有一台干净的 Linux 机器每次都替你走一遍。
#
# 五个作业。前四个互不依赖，**并行**运行：
#   hygiene   行尾检查（最快，秒级失败）
#   frontend  类型检查 + 构建
#   backend   格式检查 + 编译 + 198 项测试（含 79 项需要真实 PostgreSQL 的集成测试）+ 覆盖率
#   security  依赖漏洞扫描（NuGet + npm，**只报告不阻断**）
# 第五个（publish）只在**合并进 main 之后**跑：把应用镜像推到 GHCR，
# 让服务器 `docker compose pull` 就能更新（详见该作业的注释）。
#
# 设计依据与原理讲解：learn/02-CI-CD实践.md
# 覆盖率为什么必须排除迁移代码：Blog.Backend/coverage.runsettings 的注释
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许在 Actions 页面手动触发（排查问题、重跑时用）
  workflow_dispatch:

# 同一分支上新的推送会取消仍在跑的旧运行，避免排队浪费时间与额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 全局环境变量。
# 注意：这里**没有任何密钥**，也不需要密钥 ——
# 集成测试夹具会强制 UseEnvironment("Development")，
# 因此读到的是 appsettings.Development.json 里的开发签名密钥。
# 密钥注入是 CD（部署）阶段才需要的事。
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:

  # ══════════════════════════════════════════════════════════════════════
  # 作业一：卫生检查 —— 最快，期望它最先失败
  # ══════════════════════════════════════════════════════════════════════
  hygiene:
    name: 卫生检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 把 docs/05 §7.2 的"人肉纪律"变成机器强制。
      # 仓库历史上真发生过「39 个文件仅因 CRLF/LF 差异被整体纳入提交」。
      # 这条检查成本最低、收益最高，所以放在第一个作业里。
      - name: 检查行尾是否被写成 CRLF
        run: |
          if git ls-files --eol | grep -q 'w/crlf'; then
            echo "::error::检测到 CRLF 行尾，请检查编辑器设置（见 docs/05 §7.2）"
            echo "--- 受影响文件 ---"
            git ls-files --eol | grep 'w/crlf'
            exit 1
          fi
          echo "OK：未发现 CRLF 行尾"

  # ══════════════════════════════════════════════════════════════════════
  # 作业二：前端（与后端无依赖，完全并行）
  # ══════════════════════════════════════════════════════════════════════
  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Blog.FrontEnd
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # 内置缓存：按 package-lock.json 的哈希做缓存键
          cache: npm
          cache-dependency-path: Blog.FrontEnd/package-lock.json

      # ci 而不是 install：
      #   - 严格按 lock 文件安装，构建可复现
      #   - lock 与 package.json 不一致时**直接失败**，而不是悄悄改 lock
      - name: 安装依赖
        run: npm ci

      # 下面两条与 docs/05 §4.3 的手工命令完全一致
      - name: 类型检查
        run: npx vue-tsc -b --force

      - name: 构建
        run: npx vite build

  # ══════════════════════════════════════════════════════════════════════
  # 作业三：后端（编译 + 全部后端测试）
  # ══════════════════════════════════════════════════════════════════════
  backend:
    name: 后端（构建 + 测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # NuGet 缓存：CI 里 restore 通常是最大的时间开销。
      # 缓存键用 csproj 的哈希 —— 依赖清单没变就命中缓存，变了自动换新。
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ── 起数据库 ────────────────────────────────────────────────────
      #
      # 为什么用 `docker run` 而不是 `services:` ？
      #   集成测试需要 **zhparser 扩展**（Posts.SearchVector 是生成列，
      #   表达式用了 to_tsvector('chinese', ...)），而它不在官方镜像里、必须自行编译。
      #   而 `services:` 在 steps **之前**就启动了，**来不及先 build 镜像**。
      #   这是 learn/02 §4.2 讨论的方案 A：不需要镜像仓库，代价是每次现编译。
      #
      # 未来若嫌慢，可改成方案 B（预构建推到 ghcr.io），
      # 但要**确保改 Dockerfile 时会重新推镜像** —— 否则会测到一个过期的数据库环境，
      # 而且它还是绿的（"假绿"比红更危险）。
      - name: 构建带 zhparser 的 PostgreSQL 镜像
        run: docker build -f deploy/postgres-zhparser.Dockerfile -t blog-postgres-zhparser:18 .

      - name: 启动 PostgreSQL 与 Redis
        run: |
          # ⚠️ 凭证必须与 Blog.Backend/Blog.WebApi/appsettings.Development.json 一致。
          #    原因：测试夹具 BlogApiFactory.ResolveDevelopmentConnectionString()
          #    会**读取该文件**拿主机/端口/用户名/密码，只替换库名。
          #    也就是说 CI 里的 PG 必须监听 localhost:5432 且用户是 kky。
          docker run -d --name pgsql \
            -e POSTGRES_USER=kky \
            -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=blog_stage2 \
            -p 5432:5432 \
            blog-postgres-zhparser:18

          # 缓存连接串在 appsettings.Development.json 里是 localhost:6379。
          # 限流桶也在这里，但测试夹具已把它关掉（RateLimit:Enabled=false）。
          # ⚠️ 版本与 docker-compose.yml 保持一致，且**写死到 patch 位** ——
          #    在 CI 里用浮动 tag 会造出"本地绿、线上红"的版本漂移。
          docker run -d --name redis -p 6379:6379 redis:7.4.11-alpine

      - name: 等待 PostgreSQL 就绪
        run: |
          # ⚠️「容器启动了」!=「数据库能连了」。
          #    少了这一步，流水线会**随机失败**，而你会误以为是代码问题。
          #    随机失败比稳定失败更有害：它训练你"重跑一遍就好了"，
          #    从而彻底摧毁你对流水线的信任（learn/02 §4.3）。
          for i in $(seq 1 60); do
            if docker exec pgsql pg_isready -U kky -d blog_stage2 >/dev/null 2>&1; then
              echo "PostgreSQL 就绪（等待 $((i * 2)) 秒）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::PostgreSQL 未在 120 秒内就绪"
          docker logs pgsql
          exit 1

      # 先单独验证分词可用，再跑测试。
      # 这样万一环境有问题，失败信息是"zhparser 不可用"，
      # 而不是那句著名的、毫无信息量的
      # "The server has not been started or no web application was configured"。
      - name: 校验 zhparser 与中文分词配置
        run: |
          docker exec pgsql psql -U kky -d blog_stage2 -tAc \
            "SELECT extname FROM pg_extension WHERE extname='zhparser';" | grep -q zhparser
          docker exec pgsql psql -U kky -d blog_stage2 -tAc \
            "SELECT to_tsvector('chinese','使用 EF Core 做数据库优化与全文检索');"
          echo "OK：zhparser 扩展与 chinese 检索配置可用"

      # ── 编译与测试 ──────────────────────────────────────────────────
      - name: 还原依赖
        run: dotnet restore Blog.Backend/Blog.Backend.slnx

      # 缺口 G6：没有 lint / 格式门禁。
      #
      # ⚠️ 只查 whitespace，不查 analyzer：
      #    实测 `dotnet format --severity info` 在本仓库报 21 条 analyzer 建议
      #    （CA2016 / CA1873 / CA1816 / CA1861 / SYSLIB1045 / ASP0025）。
      #    一次性把它们变成门禁 = 21 处改动 + 长期噪音，属于过度工程化。
      #
      # ⚠️ 覆盖范围由仓库根的 .editorconfig 决定，其中 end_of_line = lf 是关键：
      #    dotnet format 在缺少该文件时的默认行尾是 CRLF，
      #    会与 .gitattributes 冲突并让上面的行尾检查变红。
      #
      # 放在这里而不是 hygiene 作业：那个作业刻意不装 .NET SDK（5 秒跑完），
      # 装 SDK + restore 会让它从"最快失败"变成最慢之一。
      # 这里紧跟 restore，复用还原结果，且仍**早于**编译与测试 —— 失败依然快。
      - name: 检查 C# 格式（.editorconfig）
        run: |
          dotnet format Blog.Backend/Blog.Backend.slnx whitespace --verify-no-changes --no-restore \
            || { echo "::error::C# 格式不符合 .editorconfig。本地执行：dotnet format Blog.Backend/Blog.Backend.slnx whitespace"; exit 1; }
          echo "OK：C# 格式符合 .editorconfig"

      - name: 编译（Release）
        run: dotnet build Blog.Backend/Blog.Backend.slnx --no-restore --configuration Release

      # 跑全部 198 项（79 集成 + 116 单元 + 3 统一响应体契约）。
      #
      # 覆盖率**只产出报告、不设阈值**：一开始就卡阈值会逼人写垃圾测试来凑数（learn/02 §5.2）。
      #
      # ⚠️ 用 --settings 而不是 --collect：
      #    排除规则（EF 迁移、源生成代码）写在 coverage.runsettings 里，
      #    而排除**只能**通过 runsettings 传。不排除的话数字是没有意义的 ——
      #    实测未排除时 Blog.Infrastructure 显示 91.8%，其中 73% 的行数是 EF 生成的迁移。
      #    两者同时给会重复挂载收集器，所以这里只留 --settings。
      #
      #    ⚠️ 代价：覆盖率从此依赖这个文件。它被删掉时 dotnet test 会**照常变绿**，
      #    所以下一步有一道显式检查兜住这个静默失效。
      - name: 跑测试并收集覆盖率
        run: >
          dotnet test Blog.Backend/Blog.Tests/Blog.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=results.trx"
          --settings Blog.Backend/coverage.runsettings

      # ⚠️ 这一步直接对应 learn/02 §8 的那句判据：
      #      「一条从来没红过的流水线，你并不知道它是否真的在检查。」
      #
      #    `dotnet test` 在**一个测试都没发现**时同样返回退出码 0。
      #    也就是说：路径写错、过滤器写错、测试工程没被编译进产物……
      #    这些情况都会让流水线**变绿**，而实际上什么都没验证。
      #
      #    这里显式解析 trx 报告，把"测试真的跑了"变成硬性检查。
      - name: 校验测试确实被执行（防假绿）
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob('**/TestResults/**/*.trx', recursive=True)
          if not files:
              print('::error::没有找到 trx 测试报告，无法确认测试是否执行')
              sys.exit(1)

          total = passed = failed = 0
          for f in files:
              root = ET.parse(f).getroot()
              ns = {'t': root.tag.split('}')[0].strip('{')}
              c = root.find('.//t:ResultSummary/t:Counters', ns)
              if c is None:
                  continue
              total  += int(c.get('total', 0))
              passed += int(c.get('passed', 0))
              failed += int(c.get('failed', 0))

          print(f'测试总数 {total}：通过 {passed}，失败 {failed}')

          # 写进 GitHub 的「作业摘要」——这样在 Actions 页面**不下载制品**就能看到数字，
          # 也方便截图留证（简历/面试时"跑了多少测试"是要能被看到的）。
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write(
                      '## 后端测试结果\n\n'
                      '| 指标 | 数量 |\n|---|---:|\n'
                      f'| 总计 | {total} |\n'
                      f'| 通过 | {passed} |\n'
                      f'| 失败 | {failed} |\n'
                  )

          if total == 0:
              print('::error::执行了 0 个测试 —— 这几乎总是"测试没被发现"，属于假绿')
              sys.exit(1)
          if failed:
              print(f'::error::有 {failed} 个测试失败')
              sys.exit(1)
          PY

      # 覆盖率不阻断，但**必须看得见**（learn/02 §5.2：
      # 「把覆盖率报告作为 CI 制品上传 —— 看得见才会被关注」）。
      # 制品要下载才看得到，写进作业摘要则是打开 PR 就在眼前。
      #
      # ⚠️ 这一步同时兼作**防静默失效**：上一步改用 --settings 之后，
      #    runsettings 被删 / 参数被改都会让覆盖率**无声消失**，
      #    而流水线依然全绿。找不到报告时这里必须报错。
      - name: 覆盖率写进作业摘要（并确认报告真的产出了）
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          files = glob.glob('**/TestResults/**/coverage.cobertura.xml', recursive=True)
          if not files:
              print('::error::没有产出 coverage.cobertura.xml —— 覆盖率收集没有生效。')
              print('::error::最常见的原因：--settings Blog.Backend/coverage.runsettings 丢失，')
              print('::error::或该文件被删除/改名。流水线不会因此变红，所以在这里显式兜住。')
              sys.exit(1)

          root = ET.parse(files[0]).getroot()
          line_rate = float(root.get('line-rate', 0)) * 100
          branch_rate = float(root.get('branch-rate', 0)) * 100
          covered = root.get('lines-covered')
          valid = root.get('lines-valid')
          print(f'行覆盖 {line_rate:.1f}%（{covered}/{valid}）  分支覆盖 {branch_rate:.1f}%')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write(
                      '## 覆盖率（仅供观察，不设阈值）\n\n'
                      '| 指标 | 数值 |\n|---|---:|\n'
                      f'| 行覆盖 | {line_rate:.1f}% ({covered}/{valid}) |\n'
                      f'| 分支覆盖 | {branch_rate:.1f}% |\n\n'
                      '> 已排除 EF 迁移与源生成代码（`coverage.runsettings`）。\n'
                      '> **不对总量设阈值**——阈值只会逼人写不 assert 的测试来凑数（learn/02 §5.2）。\n'
                  )
          PY

      # 无论成功失败都上传。
      # 只在成功时上传，等于"失败时什么都没有"—— 而失败时恰恰最需要报告。
      - name: 上传测试报告与覆盖率
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: '**/TestResults/**'
          if-no-files-found: warn

      # 集成测试失败时，最需要的信息在**数据库容器**里，而不在测试输出里
      - name: 失败时输出数据库日志
        if: failure()
        run: docker logs pgsql

  # ══════════════════════════════════════════════════════════════════════
  # 作业四：依赖安全扫描（对应 docs/06-技术债与待办.md §2 的 G5）
  #
  # 为什么单独开一个作业，而不是塞进上面两个里：
  #   ① 它回答的是**另一个问题**。上面两个问"我写的代码对不对"，
  #      这个问"我依赖的代码还安全吗" —— 后者会在一行代码都没改的情况下变坏；
  #   ② 独立作业 = 独立的检查名，将来想把它设成 Required 时，
  #      不需要改动其它两个作业的配置。
  #
  # 为什么现在**只报告不阻断**（continue-on-error）：
  #   刚引入扫描时先只看结果。等它的结果稳定、你也确认过
  #   "它报出来的东西我确实每次都会修"，再改成阻断。
  #   反过来做（先阻断）最常见的结局是：某天被一个修不了的 CVE 卡住，
  #   于是把整个作业注释掉 —— 从此它就是个摆设。
  #
  # ⚠️ 一个容易被忽略的事实（实测于 2026-09-13）：
  #   **这个项目其实早就在扫依赖漏洞了。** NuGet Audit 从 .NET 8 SDK 起默认开启，
  #   `dotnet restore` / `dotnet build` 会打出 NU1903 警告。CI 每次都在打这个警告 ——
  #   只是它是**警告**：不会让流水线变红，也不会有任何人看见。
  #   所以 G5 的准确描述不是"完全没做"，而是"信息一直在输出，却没有任何机制让它被看见"。
  #   将来要把它升级成阻断，最省事的路径是给构建加
  #   `-warnaserror:NU1901;NU1902;NU1903;NU1904`（而不是再加一个作业）。
  # ══════════════════════════════════════════════════════════════════════
  security:
    name: 依赖安全扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # dotnet list package 需要先有还原结果（obj/project.assets.json），
      # 否则它拿不到依赖树。所以这里不能省掉 restore。
      - name: 还原依赖
        run: dotnet restore Blog.Backend/Blog.Backend.slnx

      # --include-transitive 才是重点：漏洞通常藏在**传递依赖**里，
      # 只扫直接依赖会漏掉大部分情况（learn/02 §5.4）。
      #
      # 输出同时写进文件，后面那一步要把它搬进作业摘要 ——
      # 一个"只在日志深处"的检查等于没有。
      - name: NuGet 漏洞扫描（含传递依赖）
        continue-on-error: true
        run: |
          # ⚠️ 这个命令在**发现漏洞时退出码依然是 0**（实测阳性对照：
          #    故意引用 Newtonsoft.Json 12.0.1，报出 High 漏洞，退出码 0）。
          #    所以退出码只能用来判断"命令有没有跑起来"，**不能**用来判断"有没有漏洞"。
          set -o pipefail
          if ! dotnet list Blog.Backend/Blog.Backend.slnx package \
                 --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/nuget-vuln.txt"; then
            echo "::error::NuGet 漏洞扫描命令本身失败了（还原未完成？网络不通？）"
            echo "::error::⚠️ 不要把这种情况当成「没有漏洞」—— 这是一次「不知道」（见 archive/问题排查记录.md §8）"
            exit 1
          fi

          # 无论"扫出漏洞"还是"干净"，正常输出里都会出现 vulnerable / 易受攻击 字样
          # （前者："has the following vulnerable packages"，后者："has no vulnerable packages"）。
          # 两样都没有 → 说明命令没真正执行，而不是"没有漏洞"。
          if ! grep -qiE 'vulnerab|易受攻击' "$RUNNER_TEMP/nuget-vuln.txt"; then
            echo "::error::扫描输出里没有出现漏洞相关的任何字样，无法确认扫描真的执行了"
            exit 1
          fi

      - name: npm 漏洞扫描
        continue-on-error: true
        run: |
          # ⚠️⚠️ 必须显式写 --registry。原因是一个真实的坑（archive/问题排查记录.md §8）：
          #
          #   本机的默认源是 registry.npmmirror.com（淘宝镜像），
          #   而它**没有实现 audit 接口**，请求会直接返回
          #      404 [NOT_IMPLEMENTED] /-/npm/v1/security/* not implemented yet
          #
          #   而且 npm 这时是**非 0 退出**的。由于本作业是 continue-on-error，
          #   这一步会「绿着失败」—— 在页面上和「扫了，没发现漏洞」长得一模一样。
          #
          #   同理，**换掉本机默认源不能算解决** —— CI 是干净的机器，
          #   正确做法是每次显式指定，让"用哪个源审计"这件事写在流水线里。
          cd Blog.FrontEnd
          npm audit --registry=https://registry.npmjs.org 2>&1 | tee "$RUNNER_TEMP/npm-audit.txt" || true

          # npm audit 正常时一定打印 "found N vulnerabilities"（N 可以是 0）。
          # 没有这行 → 审计没执行，而不是"没有漏洞"。
          if ! grep -qiE 'vulnerabilit' "$RUNNER_TEMP/npm-audit.txt"; then
            echo "::error::npm audit 没有产出可识别的结论 —— 扫描很可能根本没执行（见 archive/问题排查记录.md §8）"
            echo "::error::⚠️ 不要把它当成「没有漏洞」"
            exit 1
          fi

      # 无论扫描成功失败都写摘要（失败的那次恰恰最需要看）。
      - name: 把扫描结果写进作业摘要
        if: always()
        run: |
          {
            echo '## 依赖安全扫描（只报告，不阻断）'
            echo
            echo '发现高危漏洞时**这里会列出**，但不会卡住合并 —— 先观察一段时间再决定是否设成门禁。'
            echo
            echo '### NuGet（含传递依赖）'
            echo '```'
            cat "$RUNNER_TEMP/nuget-vuln.txt" 2>/dev/null || echo '(没有产出，可能是扫描步骤本身失败了)'
            echo '```'
            echo '### npm'
            echo '```'
            cat "$RUNNER_TEMP/npm-audit.txt" 2>/dev/null || echo '(没有产出，可能是扫描步骤本身失败了)'
            echo '```'
            echo '> ⚠️ `SixLabors.ImageSharp` 刻意锁在 3.x（v4 起需构建期许可密钥）。'
            echo '> 因此这条扫描的结论里如果出现它，要看清楚"修复版本"是不是 4.x —— 是的话不能升，需要单独决策。'
          } >> "$GITHUB_STEP_SUMMARY"

  # ══════════════════════════════════════════════════════════════════════
  # 作业五：把应用镜像推到 GHCR —— **只有合并进 main 之后才跑**
  #
  # 这个作业解决的是部署链路上的两个真问题：
  #
  #   ① **服务器不用再收 128 MB 的 tar.gz。** Docker 按**层**拉取，
  #      改后端时通常只有应用那一层变（几 MB），而不是整个镜像。
  #      本地 `pack-images.sh` 那条路仍然保留 —— **首次部署仍然用它**
  #      （PG 镜像 439 MB，没必要每次让 CI 重建重推）。
  #
  #   ② ⭐ **补上「CI 绿」和「线上跑的那版」之间的完整性缺口。**
  #      在此之前，你部署的镜像是**本地**在 CI 绿了之后构建的 ——
  #      如果当时工作区是脏的，你会带着绿色徽章上线没测过的代码。
  #      现在服务器拉的就是 CI 从那个提交构建的镜像，tag 就是 commit sha，
  #      「线上跑的是哪个提交」不再需要考古。
  #      （这正是 docs/06 的 G4「没有发布流程与版本号」。）
  #
  # ⚠️ 两个必须知道的点：
  #   - **package 默认是私有的。** 要让服务器免登录拉取，第一次推完之后去
  #     GitHub → Packages → 该 package → Settings → 把 visibility 改成 public。
  #     仓库本身是 public，镜像里只有编译产物、**不含任何密钥**
  #     （密钥全部由 .env 在运行时注入）。
  #   - **这个作业只能靠真跑验证**：本地没法测 GHCR 推送。
  #     第一次请在 Actions 页面手动 "Run workflow" 跑一次看结果。
  # ══════════════════════════════════════════════════════════════════════
  publish:
    name: 发布镜像到 GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR 里不推：会把 registry 塞满永远不会合并的版本。
    # 允许 workflow_dispatch 是为了能手动验证这个作业本身。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN 就够 —— 推同仓库的 package 只需要 packages: write，
          # 不需要额外配 PAT（少一个会过期的凭据要维护）。
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ 主 tag 用 `github.sha`（**不可变**），另外打一个 `latest` 只为肉眼方便。
      #    **部署脚本绝不要用 latest** —— 那是个会移动的标签，出事时说不清
      #    线上跑的是哪一版（docs/05 §8.9 用的是同一条理由）。
      - name: 构建并推送 webapi
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/webapi.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-webapi:${{ github.sha }}
            ghcr.io/${{ github.repository }}-webapi:latest
          # scope 要分开：两个镜像共用一份 gha 缓存会互相冲掉
          cache-from: type=gha,scope=webapi
          cache-to: type=gha,mode=max,scope=webapi

      - name: 构建并推送 nginx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/nginx.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-nginx:${{ github.sha }}
            ghcr.io/${{ github.repository }}-nginx:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

      - name: 把镜像地址写进作业摘要
        run: |
          {
            echo '## 已发布镜像到 GHCR'
            echo
            echo '| 镜像 | tag（不可变，回滚就用它） |'
            echo '|---|---|'
            echo "| webapi | \`ghcr.io/${{ github.repository }}-webapi:${{ github.sha }}\` |"
            echo "| nginx  | \`ghcr.io/${{ github.repository }}-nginx:${{ github.sha }}\` |"
            echo
            echo '### 服务器更新'
            echo '```bash'
            echo "bash tools/deploy/server-update.sh ${{ github.sha }}"
            echo '```'
            echo '> 这个 sha 就是本次合并后的提交 —— **线上跑的哪一版从此有据可查**。'
          } >> "$GITHUB_STEP_SUMMARY"


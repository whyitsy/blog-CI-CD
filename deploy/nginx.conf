# ============================================================================
# Nginx 站点配置：同时承担两个角色
#   ① 提供前端静态文件（Vue 构建产物）
#   ② 把 /api/** 反向代理到后端 Kestrel
#
# 对应 docs/05-运维与部署手册.md §8.1 的部署拓扑。
# 本文件被复制到容器的 /etc/nginx/conf.d/default.conf（在 http 上下文里被 include）。
#
# 这个文件里每一处 ⚠️ 都是 **docs/05 §8.2 预告过、或本轮实际发现的部署坑**。
# 它们全部可以在本地 compose 里复现 —— 这正是「先本地容器化、再买服务器」的价值。
# ============================================================================

upstream blog_api {
    # 容器编排里这里写的是 **compose 服务名**，由 Docker 内置 DNS 解析。
    # 写 localhost 或 127.0.0.1 都会失败：那指向 nginx 容器自己。
    server webapi:8080;

    # 与后端保持长连接，避免每个请求都重新握手
    keepalive 32;
}

server {
    listen 80;
    # 同时监听 IPv6。不写这一行时 nginx **只绑 IPv4**，
    # 容器内任何用 `localhost`（会解析到 [::1]）发起的请求都会被拒绝。
    # 外部访问不受影响（Docker 的端口映射走 IPv4），所以这个问题很隐蔽 ——
    # 它的典型表现就是"服务明明好好的，健康检查却一直 unhealthy"。
    listen [::]:80;

    server_name _;

    # ── ⚠️ 坑 5：前面加了宿主机 TLS 层之后，真实访客 IP 会在这里丢掉 ────────
    # 拓扑变成：浏览器 → (HTTPS) 宿主机 Caddy/Nginx → (HTTP) 本容器 → webapi
    #
    # 问题：这一层的对端不再是谁，而是**宿主机的地址**（127.0.0.1 或 Docker 网桥
    # 172.x.0.1）。而下面 /api/ 段里的 `proxy_set_header X-Forwarded-For $remote_addr;`
    # 是**覆盖**写法 —— 于是所有访客被写成同一个 IP，
    # 应用的「每 IP 限流」静默退化成「全站共享一个令牌桶」：
    #   default 120 次突发、search 20 次 —— **全站**共用。
    # 一个爬虫就能吃光搜索配额，然后所有正常访客一起 429。
    # （这正是 docs/05 §8.6 修过的那个 bug，只是换了一条路径回来。）
    #
    # 解法：声明「信任来自宿主机的转发头」，$remote_addr 就被还原成真实访客 IP，
    # 下面那行覆盖写法也就重新变得正确了。
    #
    # 为什么这样是安全的：realip **只看对端地址**是否在信任列表里。
    #   ① 宿主机 Caddy 转发进来 → 对端 127.0.0.1（可信）→ 采信 XFF → 真实访客 IP ✅
    #   ② 外部客户端直连 8080  → 对端是公网 IP（不可信）→ **忽略**它伪造的 XFF，
    #      $remote_addr 仍是它自己的 IP ✅
    # 也就是说即使 8080 一时忘了关，限流也不会被绕过。
    # （但仍然应该把 8080 关掉：那是绕过 TLS 的明文旁路。）
    #
    # real_ip_recursive on：从右往左跳过可信地址，取第一个不可信的。
    # Caddy 会把真实对端 IP 追加在 XFF 最右边，所以取到的就是真实访客。
    # 用 on 而不是 off，是为了将来前面再加 CDN 时不用改这里。
    #
    # 信任范围说明：172.16.0.0/12 是整个 Docker 网桥网段，意味着**同一网络里的
    # 其它容器**也能伪造这个头。本栈那个网段上只有 pgsql/redis/webapi/nginx 四个
    # 自家容器，所以可以接受；将来若往这个网络里加了不可信的第三方容器，要收紧成具体网段。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;   # Docker 自定义网桥的默认网段
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    # ── ⚠️ 坑 4（本项目新增发现，docs/05 §8.2 未记录）────────────────────
    # 上传接口允许 10 MiB（FileStorage:MaxFileSize），而 **nginx 默认上限只有 1 MiB**。
    # 不设这一行，大于 1MB 的图片会被 nginx 直接拦成 413，
    # **请求根本到不了后端**，后端日志里什么都看不到 —— 会让人误以为是前端问题。
    client_max_body_size 12m;

    # ── 基础安全响应头 ────────────────────────────────────────────────
    # ⚠️ nginx 的 add_header 有个著名陷阱：
    #    **子 location 一旦出现自己的 add_header，父级的 add_header 会被整体丢弃（不合并）。**
    #    因此下面每个用了 add_header 的 location 都把这三个头重复了一遍。
    #    这是"看起来配了、实际没生效"的经典来源。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ────────────────────────────────────────────────────── API 反向代理
    location /api/ {
        proxy_pass http://blog_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # ⚠️ 坑 2（docs/05 §8.2）：这是「按 IP 限流」能否生效的关键。
        #
        # 没有这一行，Kestrel 看到的来源 IP 全是 nginx 的容器 IP，
        # RateLimitingMiddleware 会把所有访客当成同一个人 ——
        # 「每 IP 120 次突发」退化成「全站 120 次突发」，正常用户会被误伤。
        #
        # ⚠️⚠️ 但**光有这一行还不够，必须用 $remote_addr 覆盖而不是追加**。
        #
        # 本项目实测过这个区别（2026-09）：
        #   用 $proxy_add_x_forwarded_for（nginx 默认范例写法）时，
        #   nginx 会把客户端自己发的 X-Forwarded-For **保留在前面**再追加真实 IP，
        #   头变成 "<客户端伪造的IP>, <真实IP>"。
        #   而应用侧 RateLimitingMiddleware.GetClientIp() 取的是 **Split(',')[0]**（第一段），
        #   也就是**客户端可以随便写的那一段**。
        #
        #   实测结果：连发 28 次请求，每次换一个伪造 IP →
        #   限流 0 次（对照组正常请求在第 21 次就被限流）。
        #   **等于限流可被任意绕过。**
        #
        # $remote_addr 是 nginx 亲眼看到的对端 IP，客户端无法伪造，
        # 因此这里**覆盖**掉整个头，把不可信输入彻底丢掉。
        #
        # 📌 前提：nginx 是唯一入口（本项目的拓扑就是如此，webapi 不对外发布端口）。
        #    若将来前面再加 CDN / 云负载均衡，这里要改成配置 ngx_http_realip_module
        #    信任上游网段，而不是简单回到追加写法。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 健康检查也走反代，便于从外部探活。响应体只有 Healthy / Unhealthy。
    location = /health {
        proxy_pass http://blog_api;
        proxy_set_header Host $host;
        # 同样用 $remote_addr 覆盖，不接受客户端提供的转发头（原因见 /api/ 段的说明）
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    # ─────────────────────────── 静态资源（文件名自带内容哈希，可长缓存）
    location /assets/ {
        # Vite 产出的是 index-<hash>.js / index-<hash>.css 这类文件名：
        # 内容一变文件名就变，所以可以放心缓存一年。
        expires 1y;
        add_header Cache-Control "public, immutable";

        # 重复父级安全头（原因见上方 add_header 陷阱说明）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # ─── index.html 必须**不缓存** ──────────────────────────────────────
    # 它引用的是 /assets/index-<hash>.js，每次构建哈希都会变。
    # 一旦 index.html 被缓存，用户会一直加载**旧版本前端**，
    # 而旧前端可能调用已经改过的 API —— 表现为"我明明发了新版，用户还是报错"。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # ─────────────────────────────────────── SPA history fallback
    location / {
        # ⚠️ 坑 1（docs/05 §8.2）：前端路由用的是 createWebHistory()，
        #    /post/xxx、/admin/posts/new 这些路径在磁盘上**没有对应文件**。
        #    没有这一行，**直接刷新（或分享链接给别人打开）就会 404**。
        #
        #    这个坑在开发期**测不出来**：Vite dev server 内置了同样的 fallback。
        #    它就是你想在简历里写的「完整开发到上线」里最典型的那类问题。
        try_files $uri $uri/ /index.html;
    }
}

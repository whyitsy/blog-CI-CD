<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1000" height="720" fill="#f7f8fa"/>
  <text x="500" y="26" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">核心数据流：读路径（带缓存）与 写路径（乐观锁 + 缓存失效）</text>
  <text x="500" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">请求管线：限流中间件 → 异常中间件 → Serilog 日志 → Controller → Service → (Cache / Repository) → PostgreSQL</text>

  <!-- ================= 读路径（左列） ================= -->
  <text x="250" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">① 读路径 · GET /api/posts</text>

  <g>
    <rect x="70" y="92" width="360" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
    <text x="250" y="115" text-anchor="middle" font-size="12" fill="#1e3a8a">Client → PostsController.GetPaged(page,size,…)</text>
    <rect x="70" y="142" width="360" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="250" y="165" text-anchor="middle" font-size="12" fill="#374151">RateLimitingMiddleware（令牌桶，超→429）</text>
    <rect x="70" y="192" width="360" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="250" y="215" text-anchor="middle" font-size="12" fill="#374151">ExceptionHandling + Serilog 请求日志</text>
    <rect x="70" y="242" width="360" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="250" y="265" text-anchor="middle" font-size="12" fill="#374151">IPostService.GetPagedAsync</text>
    <rect x="70" y="292" width="360" height="38" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
    <text x="250" y="315" text-anchor="middle" font-size="12" fill="#374151">ICacheService.GetOrCreateAsync(cacheKey)</text>

    <!-- decision diamond -->
    <polygon points="250,360 330,392 250,424 170,392" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
    <text x="250" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">缓存命中?</text>

    <!-- yes branch -->
    <line x1="330" y1="392" x2="430" y2="392" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="430" y="374" width="160" height="36" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
    <text x="510" y="396" text-anchor="middle" font-size="11.5" fill="#14532d">命中 → 直接返回</text>

    <!-- no branch -->
    <line x1="250" y1="424" x2="250" y2="456" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
    <rect x="70" y="456" width="360" height="44" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
    <text x="250" y="478" text-anchor="middle" font-size="12" fill="#374151">未命中 → IPostQueryRepository → EF Core</text>
    <text x="250" y="494" text-anchor="middle" font-size="12" fill="#374151">→ PostgreSQL（投影为 PostCardDto）</text>

    <line x1="250" y1="500" x2="250" y2="532" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <rect x="70" y="532" width="360" height="38" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="250" y="555" text-anchor="middle" font-size="12" fill="#374151">SetAsync(缓存, TTL+随机抖动)</text>

    <line x1="250" y1="570" x2="250" y2="602" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <rect x="70" y="602" width="360" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
    <text x="250" y="625" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">ApiResponse&lt;PagedResult&lt;PostCardDto&gt;&gt;</text>
  </g>

  <!-- ================= 写路径（右列） ================= -->
  <text x="750" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#9f1239">② 写路径 · PUT /api/posts/{id}</text>

  <g>
    <rect x="570" y="92" width="360" height="38" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.2"/>
    <text x="750" y="115" text-anchor="middle" font-size="12" fill="#9f1239">Client → PostsController.Update(id, req[含 version])</text>
    <rect x="570" y="142" width="360" height="38" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="750" y="165" text-anchor="middle" font-size="12" fill="#374151">限流 + 异常 + 日志</text>
    <rect x="570" y="192" width="360" height="38" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="750" y="215" text-anchor="middle" font-size="12" fill="#374151">IPostService.UpdateAsync</text>
    <rect x="570" y="242" width="360" height="44" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="750" y="264" text-anchor="middle" font-size="12" fill="#374151">GetByIdAsync(tracked,含Tags)</text>
    <text x="750" y="280" text-anchor="middle" font-size="12" fill="#374151">+ ApplyOptimisticVersion(expected)</text>

    <line x1="750" y1="286" x2="750" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <rect x="570" y="318" width="360" height="46" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="750" y="340" text-anchor="middle" font-size="12" fill="#374151">post.Update + ApplyTagsAsync(增量同步)</text>
    <text x="750" y="356" text-anchor="middle" font-size="12" fill="#374151">→ IUnitOfWork.SaveChangesAsync</text>

    <line x1="750" y1="364" x2="750" y2="396" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <rect x="570" y="396" width="360" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="750" y="420" text-anchor="middle" font-size="12" fill="#92400e">UPDATE … WHERE "Version"=@expected</text>

    <!-- conflict diamond -->
    <line x1="750" y1="436" x2="750" y2="468" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <polygon points="750,468 838,502 750,536 662,502" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4"/>
    <text x="750" y="506" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">0 行受影响?</text>

    <!-- conflict yes -->
    <line x1="838" y1="502" x2="930" y2="502" stroke="#dc2626" stroke-width="2" marker-end="url(#a)"/>
    <rect x="930" y="484" width="58" height="36" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
    <text x="959" y="506" text-anchor="middle" font-size="11" fill="#7f1d1d">409/4090</text>

    <!-- conflict no -->
    <line x1="750" y1="536" x2="750" y2="568" stroke="#16a34a" stroke-width="2" marker-end="url(#a)"/>
    <rect x="570" y="568" width="360" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="750" y="591" text-anchor="middle" font-size="12" fill="#374151">Version+1 提交成功 → 缓存失效</text>

    <line x1="750" y1="606" x2="750" y2="638" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <rect x="570" y="638" width="360" height="38" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.4"/>
    <text x="750" y="661" text-anchor="middle" font-size="12" font-weight="600" fill="#9f1239">RemoveByPrefix(posts:) + Remove(site:stats)</text>
  </g>

  <!-- arrows marker -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- legends -->
  <g>
    <rect x="70" y="676" width="14" height="14" rx="3" fill="#16a34a"/>
    <text x="90" y="687" font-size="11" fill="#374151">命中/成功</text>
    <rect x="170" y="676" width="14" height="14" rx="3" fill="#dc2626"/>
    <text x="190" y="687" font-size="11" fill="#374151">未命中/冲突</text>
    <rect x="290" y="676" width="14" height="14" rx="3" fill="#d97706"/>
    <text x="310" y="687" font-size="11" fill="#374151">决策点</text>
  </g>
</svg>

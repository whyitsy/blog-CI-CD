<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="1120" height="580" fill="#f7f8fa"/>
  <text x="560" y="26" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Blog 个人博客系统 · 分层架构（整洁架构 Clean Architecture）</text>
  <text x="560" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">依赖方向：外环 → 内环（WebApi → Application → Domain）；Infrastructure 实现 Application/Domain 接口并访问 PostgreSQL</text>

  <!-- ============ Client ============ -->
  <g>
    <rect x="24" y="70" width="150" height="42" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="99" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">客户端层</text>
    <rect x="24" y="122" width="150" height="120" rx="9" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="99" y="150" text-anchor="middle" font-size="12" fill="#374151">Vue3 + TypeScript</text>
    <text x="99" y="172" text-anchor="middle" font-size="12" fill="#374151">Vite + Pinia</text>
    <text x="99" y="194" text-anchor="middle" font-size="12" fill="#374151">Vue Router</text>
    <text x="99" y="216" text-anchor="middle" font-size="12" fill="#374151">Naive UI + SCSS</text>
  </g>

  <!-- ============ WebApi ============ -->
  <g>
    <rect x="190" y="70" width="150" height="42" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="265" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">Blog.WebApi</text>
    <rect x="190" y="122" width="150" height="78" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="265" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Controllers</text>
    <text x="265" y="168" text-anchor="middle" font-size="11" fill="#374151">Posts / Categories /</text>
    <text x="265" y="184" text-anchor="middle" font-size="11" fill="#374151">Tags / Site /</text>
    <text x="265" y="200" text-anchor="middle" font-size="11" fill="#374151">Authors / Files</text>
    <rect x="190" y="212" width="150" height="92" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
    <text x="265" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Middleware</text>
    <text x="265" y="256" text-anchor="middle" font-size="11" fill="#374151">· 全局异常</text>
    <text x="265" y="274" text-anchor="middle" font-size="11" fill="#374151">· 令牌桶限流</text>
    <text x="265" y="292" text-anchor="middle" font-size="11" fill="#374151">· Serilog 请求日志</text>
  </g>

  <!-- ============ Application ============ -->
  <g>
    <rect x="356" y="70" width="150" height="42" rx="9" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="431" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">Blog.Application</text>
    <rect x="356" y="122" width="150" height="78" rx="9" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="431" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Services</text>
    <text x="431" y="168" text-anchor="middle" font-size="11" fill="#374151">Post / Category /</text>
    <text x="431" y="184" text-anchor="middle" font-size="11" fill="#374151">Tag / Site / Author</text>
    <text x="431" y="200" text-anchor="middle" font-size="11" fill="#374151">(用例编排)</text>
    <rect x="356" y="212" width="150" height="92" rx="9" fill="#ffffff" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="431" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Common</text>
    <text x="431" y="256" text-anchor="middle" font-size="11" fill="#374151">ApiResponse /</text>
    <text x="431" y="272" text-anchor="middle" font-size="11" fill="#374151">PagedResult /</text>
    <text x="431" y="288" text-anchor="middle" font-size="11" fill="#374151">BusinessException + DTO</text>
  </g>

  <!-- ============ Domain ============ -->
  <g>
    <rect x="522" y="70" width="140" height="42" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="592" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Blog.Domain</text>
    <rect x="522" y="122" width="140" height="86" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="592" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Entities</text>
    <text x="592" y="168" text-anchor="middle" font-size="11" fill="#374151">Post / Author /</text>
    <text x="592" y="184" text-anchor="middle" font-size="11" fill="#374151">Category / Tag /</text>
    <text x="592" y="200" text-anchor="middle" font-size="11" fill="#374151">SocialLink /</text>
    <text x="592" y="216" text-anchor="middle" font-size="11" fill="#374151">SiteConfig</text>
    <rect x="522" y="220" width="140" height="80" rx="9" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="592" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">接口</text>
    <text x="592" y="270" text-anchor="middle" font-size="11" fill="#374151">IRepository*</text>
    <text x="592" y="288" text-anchor="middle" font-size="11" fill="#374151">IUnitOfWork</text>
  </g>

  <!-- ============ Infrastructure ============ -->
  <g>
    <rect x="678" y="70" width="200" height="42" rx="9" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
    <text x="778" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">Blog.Infrastructure</text>
    <rect x="678" y="122" width="200" height="72" rx="9" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="778" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#9f1239">Persistence</text>
    <text x="778" y="166" text-anchor="middle" font-size="11" fill="#374151">BlogDbContext / 仓储实现</text>
    <text x="778" y="182" text-anchor="middle" font-size="11" fill="#374151">UnitOfWork / 慢查询拦截</text>
    <rect x="678" y="206" width="200" height="42" rx="9" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="778" y="231" text-anchor="middle" font-size="11" fill="#374151">Caching：Redis / Memory / Null（三防）</text>
    <rect x="678" y="254" width="200" height="42" rx="9" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="778" y="279" text-anchor="middle" font-size="11" fill="#374151">RateLimiting：Redis / 内存 令牌桶</text>
    <rect x="678" y="302" width="200" height="40" rx="9" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
    <text x="778" y="326" text-anchor="middle" font-size="11" fill="#374151">Files：LocalFileStorage</text>
  </g>

  <!-- ============ PostgreSQL ============ -->
  <g>
    <rect x="894" y="70" width="200" height="42" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="994" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">PostgreSQL</text>
    <ellipse cx="994" cy="150" rx="92" ry="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="902" y="150" width="184" height="172" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <ellipse cx="994" cy="322" rx="92" ry="16" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="994" y="200" text-anchor="middle" font-size="12" fill="#1e3a8a">Posts</text>
    <text x="994" y="224" text-anchor="middle" font-size="12" fill="#1e3a8a">Authors</text>
    <text x="994" y="248" text-anchor="middle" font-size="12" fill="#1e3a8a">Categories</text>
    <text x="994" y="272" text-anchor="middle" font-size="12" fill="#1e3a8a">Tags</text>
    <text x="994" y="296" text-anchor="middle" font-size="12" fill="#1e3a8a">SocialLinks</text>
    <text x="994" y="312" text-anchor="middle" font-size="12" fill="#1e3a8a">SiteConfigs</text>
  </g>

  <!-- ============ Arrows ============ -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Client -> WebApi -->
  <line x1="174" y1="150" x2="188" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- WebApi -> Application -->
  <line x1="340" y1="160" x2="354" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Application -> Domain -->
  <line x1="506" y1="165" x2="520" y2="165" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Infrastructure -> PostgreSQL -->
  <line x1="878" y1="200" x2="892" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Infrastructure -> Domain (U curve, implements interfaces) -->
  <path d="M678,342 L678,420 L522,420 L522,300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="438" text-anchor="middle" font-size="10.5" fill="#475569">实现实体持久化与 IRepository / IUnitOfWork / ICacheService / ITokenBucketLimiter 接口</text>

  <!-- WebApi -> Infrastructure (dashed U, DI wiring) -->
  <path d="M265,304 L265,470 L778,470 L778,344" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowD)"/>
  <text x="420" y="488" text-anchor="middle" font-size="10.5" fill="#6b7280">Program.cs 中 DI 装配：AddInfrastructureServices（外层不感知具体实现）</text>

  <!-- Redis external note -->
  <rect x="678" y="500" width="200" height="44" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="778" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Redis（外部服务）</text>
  <text x="778" y="538" text-anchor="middle" font-size="10.5" fill="#7f1d1d">缓存 / 限流，可选 · 不可用时自动降级</text>
  <line x1="778" y1="342" x2="778" y2="498" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowD)"/>
</svg>
